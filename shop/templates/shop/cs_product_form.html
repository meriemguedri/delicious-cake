{% extends 'base.html' %}
{% block title %}{% if edit %}Produkt bearbeiten{% else %}Neues Produkt{% endif %}{% endblock %}
{% block content %}

<div class="form-container">
    <h1>{% if edit %}Produkt bearbeiten{% else %}Neues Produkt hinzufuegen{% endif %}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Speichern</button>
    </form>
    <a class="btn-link" href="{% url 'cs_portal' %}">Zurueck zum Portal</a>
</div>

{% endblock %}
