{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="form-container">
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p>Noch kein Konto? <a href="{% url 'signup' %}">Registrieren</a></p>
</div>

{% endblock %}
