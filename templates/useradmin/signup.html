{% extends 'base.html' %}
{% block title %}Registrieren{% endblock %}
{% block content %}

<div class="form-container">
    <h1>Registrieren</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Registrieren</button>
    </form>
    <p>Schon ein Konto? <a href="{% url 'login' %}">Login</a></p>
</div>

{% endblock %}
